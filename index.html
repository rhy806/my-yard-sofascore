<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Дворовый Flashscore</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Подключаем клиент Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #121212);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e1e1e);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #a1a1aa);
      --accent: #22c55e;
      --danger: #ef4444;
      --gold: #f59e0b;
      --blue: #3b82f6;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0 0 70px 0;
    }

    header {
      background-color: var(--card-bg);
      padding: 16px;
      text-align: center;
      font-weight: bold;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .tab-content { display: none; padding: 16px; }
    .tab-content.active { display: block; }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .clickable-card {
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .clickable-card:active {
      opacity: 0.8;
    }

    input, select, button.form-btn {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: var(--bg);
      color: var(--text);
      box-sizing: border-box;
    }

    button.form-btn {
      background: var(--accent);
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    button.cancel-btn {
      background: transparent;
      color: var(--hint);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 10px;
      width: 100%;
      cursor: pointer;
      font-weight: bold;
    }

    .action-btns {
      display: flex;
      gap: 6px;
    }

    .edit-btn {
      background: rgba(59, 130, 246, 0.15);
      color: var(--blue);
      border: 1px solid var(--blue);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .delete-btn {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid var(--danger);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .match-header {
      font-size: 12px;
      color: var(--hint);
      margin-bottom: 8px;
      text-align: center;
    }

    .match-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 15px;
    }

    .goals-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--hint);
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(255,255,255,0.1);
    }

    .goals-col {
      width: 48%;
      word-wrap: break-word;
    }

    .goals-col.right {
      text-align: right;
    }

    .mvp-row {
      margin-top: 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--gold);
      text-align: center;
      background: rgba(245, 158, 11, 0.1);
      border-radius: 6px;
      padding: 6px;
    }

    .admin-match-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    /* ------------------------------------ */
    /* СТИЛИ ДЛЯ ОКНА ДЕТАЛЕЙ МАТЧА (FLASHSCORE STYLE) */
    /* ------------------------------------ */
    .match-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--bg);
      z-index: 1000;
      display: none;
      overflow-y: auto;
      padding-bottom: 30px;
    }

    .match-modal.active {
      display: block;
    }

    .modal-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background-color: var(--card-bg);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 22px;
      cursor: pointer;
      padding: 0 8px 0 0;
    }

    .hero-scoreboard {
      background: linear-gradient(180deg, var(--card-bg) 0%, var(--bg) 100%);
      padding: 24px 16px;
      text-align: center;
    }

    .hero-date {
      font-size: 12px;
      color: var(--hint);
      margin-bottom: 16px;
    }

    .hero-teams {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .hero-team {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .hero-team-icon {
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .hero-team-name {
      font-weight: bold;
      font-size: 15px;
      text-align: center;
    }

    .hero-score-box {
      font-size: 32px;
      font-weight: 800;
      color: var(--accent);
      padding: 0 12px;
      letter-spacing: 2px;
    }

    .modal-tabs {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 16px;
      background: var(--card-bg);
    }

    .modal-tab-btn {
      flex: 1;
      padding: 12px;
      text-align: center;
      background: none;
      border: none;
      color: var(--hint);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .modal-tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .modal-content-area {
      padding: 0 16px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.1);
      z-index: 999;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      color: var(--hint);
      border: none;
      background: none;
    }

    .nav-item.active { color: var(--accent); }
    .nav-item span { font-size: 20px; }
    
    #admin-nav-btn { display: none; }
  </style>
</head>
<body>

  <header>⚽️ ФК «Наш Двор»</header>

  <!-- ВКЛАДКА: МАТЧИ -->
  <div id="matches" class="tab-content active">
    <h3>Список матчей</h3>
    <p style="font-size:12px; color:var(--hint); margin-top:-8px;">💡 Нажмите на матч для подробностей</p>
    <div id="matches-list">Загрузка матчей...</div>
  </div>

  <!-- ВКЛАДКА: СЕКРЕТНАЯ АДМИНКА -->
  <div id="admin" class="tab-content">
    <h3>⚙️ Панель администратора</h3>
    
    <!-- Форма создания / редактирования -->
    <div class="card">
      <h4 id="form-title">➕ Добавить новый матч</h4>
      <input type="text" id="team1" placeholder="Команда 1 (например, Наш Двор)">
      <input type="text" id="team2" placeholder="Команда 2 (например, Соседи)">
      <input type="text" id="score" placeholder="Счет (например, 3 : 1)">
      <input type="text" id="match_date" placeholder="Дата/время (например, Сегодня в 18:00)">
      <input type="text" id="goals1" placeholder="Голы Команды 1 (например, Иванов, Петров-2)">
      <input type="text" id="goals2" placeholder="Голы Команды 2 (например, Сидоров)">
      <input type="text" id="best_player" placeholder="⭐ Лучший игрок (например, Алексей Иванов)">
      
      <button class="form-btn" id="save-btn" onclick="saveMatch()">Сохранить матч</button>
      <button class="cancel-btn" id="cancel-btn" style="display:none;" onclick="cancelEdit()">Отмена редактирования</button>
    </div>

    <!-- Управление созданными матчами -->
    <div class="card">
      <h4>📋 Управление матчами</h4>
      <div id="admin-matches-list">Загрузка...</div>
    </div>
  </div>

  <!-- ---------------------------------------------------- -->
  <!-- МОДАЛЬНОЕ ОКНО ПРОСМОТРА ДЕТАЛЕЙ МАТЧА (FLASHSCORE) -->
  <!-- ---------------------------------------------------- -->
  <div id="match-details-modal" class="match-modal">
    <div class="modal-top-bar">
      <button class="back-btn" onclick="closeMatchModal()">←</button>
      <span style="font-weight: bold; font-size: 15px;">Обзор матча</span>
      <div style="width: 24px;"></div> <!-- Пустой блок для центрирования -->
    </div>

    <!-- Шапка счета -->
    <div class="hero-scoreboard">
      <div class="hero-date" id="m-date">Завершен</div>
      <div class="hero-teams">
        <div class="hero-team">
          <div class="hero-team-icon">⚽</div>
          <div class="hero-team-name" id="m-team1">Команда 1</div>
        </div>
        <div class="hero-score-box" id="m-score">0 - 0</div>
        <div class="hero-team">
          <div class="hero-team-icon">⚽</div>
          <div class="hero-team-name" id="m-team2">Команда 2</div>
        </div>
      </div>
    </div>

    <!-- Переключатель вкладок внутри матча -->
    <div class="modal-tabs">
      <button class="modal-tab-btn active" onclick="switchModalTab('m-tab-details', this)">Детали</button>
      <button class="modal-tab-btn" onclick="switchModalTab('m-tab-goals', this)">Голы и MVP</button>
    </div>

    <!-- Содержимое вкладок -->
    <div class="modal-content-area">
      <!-- Вкладка 1: Детали -->
      <div id="m-tab-details">
        <div class="card">
          <h4 style="margin-top:0;">⚽ Забитые мячи</h4>
          <div class="goals-row" style="border:none; padding-top:0;">
            <div class="goals-col" id="m-goals1-list">—</div>
            <div class="goals-col right" id="m-goals2-list">—</div>
          </div>
        </div>
      </div>

      <!-- Вкладка 2: Голы и MVP -->
      <div id="m-tab-goals" style="display: none;">
        <div class="card" id="m-mvp-card">
          <h4 style="margin-top:0; color:var(--gold);">🏅 Игрок матча</h4>
          <div id="m-mvp-name" style="font-size: 16px; font-weight: bold;">Не указан</div>
        </div>
      </div>
    </div>
  </div>

  <!-- НИЖНЯЯ НАВИГАЦИЯ -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('matches', this)">
      <span>⚽️</span>Матчи
    </button>
    <button id="admin-nav-btn" class="nav-item" onclick="switchTab('admin', this)">
      <span>⚙️</span>Админка
    </button>
  </nav>

  <script>
    // ТВОЙ TELEGRAM ID
    const ADMIN_TELEGRAM_ID = 1435007314; 

    // ТВОИ ДАННЫЕ SUPABASE
    const SUPABASE_URL = 'https://ssriiiiuljdeftigdiyl.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_jWUTsulzCMEQV6O26zac-g_04tBxiy4';
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let allMatches = [];
    let editingMatchId = null;

    // Проверяем админа
    const userId = tg.initDataUnsafe?.user?.id;
    if (userId === ADMIN_TELEGRAM_ID) {
      document.getElementById('admin-nav-btn').style.display = 'flex';
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    // Сохранение матча
    async function saveMatch() {
      const team1 = document.getElementById('team1').value;
      const team2 = document.getElementById('team2').value;
      const score = document.getElementById('score').value;
      const match_date = document.getElementById('match_date').value;
      const goals1 = document.getElementById('goals1').value;
      const goals2 = document.getElementById('goals2').value;
      const best_player = document.getElementById('best_player').value;

      if (!team1 || !team2) return alert('Заполните названия команд');

      const matchData = { team1, team2, score, match_date, goals1, goals2, best_player };

      let error = null;

      if (editingMatchId) {
        const response = await _supabase.from('matches').update(matchData).eq('id', editingMatchId);
        error = response.error;
      } else {
        const response = await _supabase.from('matches').insert([matchData]);
        error = response.error;
      }

      if (error) {
        alert('Ошибка при сохранении: ' + error.message);
      } else {
        alert(editingMatchId ? 'Матч обновлен!' : 'Матч добавлен!');
        resetForm();
        loadMatches();
      }
    }

    // Редактирование
    function editMatch(id) {
      const match = allMatches.find(m => String(m.id) === String(id));
      if (!match) return alert('Не удалось найти данные');

      editingMatchId = match.id;
      document.getElementById('team1').value = match.team1 || '';
      document.getElementById('team2').value = match.team2 || '';
      document.getElementById('score').value = match.score || '';
      document.getElementById('match_date').value = match.match_date || '';
      document.getElementById('goals1').value = match.goals1 || '';
      document.getElementById('goals2').value = match.goals2 || '';
      document.getElementById('best_player').value = match.best_player || '';

      document.getElementById('form-title').innerText = '✏️ Редактировать матч';
      document.getElementById('save-btn').innerText = 'Сохранить изменения';
      document.getElementById('cancel-btn').style.display = 'block';

      window.scrollTo({ top: 0, behavior: 'smooth' });
      document.getElementById('team1').focus();
    }

    function cancelEdit() { resetForm(); }

    function resetForm() {
      editingMatchId = null;
      document.getElementById('team1').value = '';
      document.getElementById('team2').value = '';
      document.getElementById('score').value = '';
      document.getElementById('match_date').value = '';
      document.getElementById('goals1').value = '';
      document.getElementById('goals2').value = '';
      document.getElementById('best_player').value = '';

      document.getElementById('form-title').innerText = '➕ Добавить новый матч';
      document.getElementById('save-btn').innerText = 'Сохранить матч';
      document.getElementById('cancel-btn').style.display = 'none';
    }

    async function deleteMatch(id) {
      if (!confirm('Вы уверены, что хотите удалить этот матч?')) return;

      const { error } = await _supabase.from('matches').delete().eq('id', id);

      if (error) {
        alert('Ошибка при удалении: ' + error.message);
      } else {
        alert('Матч удален!');
        if (editingMatchId === id) resetForm();
        loadMatches();
      }
    }

    // ------------------------------------
    // ФУНКЦИИ МОДАЛЬНОГО ОКНА ДЕТАЛЕЙ МАТЧА
    // ------------------------------------
    function openMatchDetails(id) {
      const match = allMatches.find(m => String(m.id) === String(id));
      if (!match) return;

      document.getElementById('m-team1').innerText = match.team1 || 'Команда 1';
      document.getElementById('m-team2').innerText = match.team2 || 'Команда 2';
      document.getElementById('m-score').innerText = match.score || 'vs';
      document.getElementById('m-date').innerText = match.match_date ? '📅 ' + match.match_date : 'Завершен';

      document.getElementById('m-goals1-list').innerHTML = match.goals1 ? '⚽ ' + match.goals1 : '—';
      document.getElementById('m-goals2-list').innerHTML = match.goals2 ? '⚽ ' + match.goals2 : '—';

      document.getElementById('m-mvp-name').innerText = match.best_player ? match.best_player : 'Не указан';

      document.getElementById('match-details-modal').classList.add('active');
    }

    function closeMatchModal() {
      document.getElementById('match-details-modal').classList.remove('active');
    }

    function switchModalTab(tabId, btn) {
      document.getElementById('m-tab-details').style.display = 'none';
      document.getElementById('m-tab-goals').style.display = 'none';
      
      document.querySelectorAll('.modal-tab-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(tabId).style.display = 'block';
      btn.classList.add('active');
    }

    // Загрузка матчей
    async function loadMatches() {
      const { data: matches, error } = await _supabase
        .from('matches')
        .select('*')
        .order('created_at', { ascending: false });

      const container = document.getElementById('matches-list');
      const adminContainer = document.getElementById('admin-matches-list');

      if (error || !matches || matches.length === 0) {
        allMatches = [];
        container.innerHTML = '<p style="color:var(--hint);">Матчей пока нет.</p>';
        adminContainer.innerHTML = '<p style="color:var(--hint);">Нет сохраненных матчей.</p>';
        return;
      }

      allMatches = matches;

      // Список для пользователей (при клике открывает экран матча)
      container.innerHTML = matches.map(m => {
        const hasGoals = m.goals1 || m.goals2;
        return `
          <div class="card clickable-card" onclick="openMatchDetails('${m.id}')">
            ${m.match_date ? `<div class="match-header">📅 ${m.match_date}</div>` : ''}
            <div class="match-row">
              <span style="width:38%; text-align:left;">${m.team1}</span>
              <span style="color:var(--accent); text-align:center; min-width:40px;">${m.score || 'vs'}</span>
              <span style="width:38%; text-align:right;">${m.team2}</span>
            </div>
            ${hasGoals ? `
              <div class="goals-row">
                <div class="goals-col">⚽ ${m.goals1 || '—'}</div>
                <div class="goals-col right">⚽ ${m.goals2 || '—'}</div>
              </div>
            ` : ''}
            ${m.best_player ? `<div class="mvp-row">🏅 Лучший игрок: ${m.best_player}</div>` : ''}
          </div>
        `;
      }).join('');

      // Список для админа
      adminContainer.innerHTML = matches.map(m => `
        <div class="admin-match-item">
          <div>
            <strong>${m.team1} — ${m.team2}</strong> <br>
            <small style="color:var(--hint);">
              ${m.match_date ? '📅 ' + m.match_date + ' | ' : ''}Счет: ${m.score || 'не указан'}
            </small>
          </div>
          <div class="action-btns">
            <button class="edit-btn" onclick="editMatch('${m.id}')">✏️</button>
            <button class="delete-btn" onclick="deleteMatch('${m.id}')">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    loadMatches();
  </script>
</body>
</html>
