<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Дворовый Flashscore</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #121212);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e1e1e);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #a1a1aa);
      --accent: #22c55e; /* Спортивный зеленый цвет */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0 0 70px 0; /* Отступ снизу под навигацию */
    }

    header {
      background-color: var(--card-bg);
      padding: 16px;
      text-align: center;
      font-weight: bold;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .tab-content {
      display: none;
      padding: 16px;
    }

    .tab-content.active {
      display: block;
    }

    /* Карточки матчей */
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--hint);
      margin-bottom: 8px;
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
    }

    /* Список игроков */
    .player-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    /* Нижнее меню */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      color: var(--hint);
      cursor: pointer;
      border: none;
      background: none;
    }

    .nav-item.active {
      color: var(--accent);
    }

    .nav-item span {
      font-size: 20px;
    }
  </style>
</head>
<body>

  <header id="app-header">⚽️ ФК «Наш Двор»</header>

  <!-- ВКЛАДКА 1: МАТЧИ -->
  <div id="matches" class="tab-content active">
    <div class="card">
      <div class="match-header">
        <span>ТУР 5 • ВЧЕРА</span>
        <span style="color: var(--accent); font-weight: bold;">ЗАВЕРШЕН</span>
      </div>
      <div class="score-row">
        <span>ФК «Наш Двор»</span>
        <span style="color: var(--accent);">3 : 1</span>
        <span>«Соседи»</span>
      </div>
    </div>

    <div class="card">
      <div class="match-header">
        <span>ТУР 6 • ВОСКРЕСЕНЬЕ, 18:00</span>
        <span>АНОНС</span>
      </div>
      <div class="score-row">
        <span>ФК «Наш Двор»</span>
        <span>vs</span>
        <span>«Заводчан»</span>
      </div>
    </div>
  </div>

  <!-- ВКЛАДКА 2: СОСТАВ -->
  <div id="squad" class="tab-content">
    <div class="card">
      <div class="player-row">
        <span>🧤 1. Алексей Смирнов</span>
        <span style="color: var(--hint);">Вратарь</span>
      </div>
      <div class="player-row">
        <span>⚽️ 9. Иван Иванов</span>
        <span style="color: var(--accent);">5 голов</span>
      </div>
      <div class="player-row">
        <span>👟 10. Сергей Петров</span>
        <span style="color: var(--hint);">3 ассиста</span>
      </div>
    </div>
  </div>

  <!-- ВКЛАДКА 3: ТАБЛИЦА -->
  <div id="table" class="tab-content">
    <div class="card">
      <div class="player-row" style="font-weight: bold;">
        <span>Команда</span>
        <span>Очки</span>
      </div>
      <div class="player-row">
        <span>1. 🥇 ФК «Наш Двор»</span>
        <span>12</span>
      </div>
      <div class="player-row">
        <span>2. 🥈 «Соседи»</span>
        <span>9</span>
      </div>
      <div class="player-row">
        <span>3. 🥉 «Заводчане»</span>
        <span>4</span>
      </div>
    </div>
  </div>

  <!-- НИЖНЯЯ НАВИГАЦИЯ -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('matches', this)">
      <span>⚽️</span>
      Матчи
    </button>
    <button class="nav-item" onclick="switchTab('squad', this)">
      <span>👥</span>
      Состав
    </button>
    <button class="nav-item" onclick="switchTab('table', this)">
      <span>🏆</span>
      Таблица
    </button>
  </nav>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function switchTab(tabId, btn) {
      // Скрываем все вкладки
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      // Снимаем подсвечивание со всех кнопок
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

      // Показываем нужную вкладку и подсвечиваем кнопку
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }
  </script>
</body>
</html>
