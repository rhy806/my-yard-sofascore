<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ФК Яйц</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #121214;
      --card-bg: #1e1e22;
      --card-inner: #26262b;
      --text: #ffffff;
      --hint: #8e8e93;
      --accent: #22c55e;
      --danger: #ef4444;
      --gold: #f59e0b;
      --blue: #3b82f6;
      --pitch-bg: #15241a;
      --pitch-line: rgba(255, 255, 255, 0.18);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0 0 70px 0;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ШАПКА */
    .team-header {
      background: linear-gradient(180deg, #2a2a30 0%, var(--bg) 100%);
      padding: 20px 16px 0 16px;
    }

    .team-title-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .team-badge-icon {
      width: 44px;
      height: 44px;
      background: var(--card-inner);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .team-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    /* ВКЛАДКИ НАВИГАЦИИ */
    .top-nav-tabs {
      display: flex;
      gap: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .top-nav-tabs::-webkit-scrollbar { display: none; }

    .top-tab-btn {
      background: none;
      border: none;
      color: var(--hint);
      font-size: 15px;
      font-weight: 700;
      padding: 10px 0;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
    }

    .top-tab-btn.active { color: #ffffff; }
    .top-tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent);
      border-radius: 3px 3px 0 0;
    }

    .tab-content { display: none; padding: 16px; }
    .tab-content.active { display: block; }

    .section-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 16px 0 10px 0;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    /* АККОРДЕОН */
    .card-accordion-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .card-accordion-header h4 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }

    .accordion-icon {
      font-size: 12px;
      color: var(--hint);
      transition: transform 0.25s ease;
      background: var(--card-inner);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card.open .accordion-icon {
      transform: rotate(180deg);
      color: var(--accent);
    }

    .card-body {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .card.open .card-body {
      display: block;
    }

    .empty-card-placeholder {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      color: var(--hint);
      font-size: 14px;
      font-weight: 600;
      border: 1px dashed rgba(255,255,255,0.1);
    }

    .clickable-card {
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }
    .clickable-card:active {
      opacity: 0.85;
      transform: scale(0.99);
    }

    /* ПЛАШКА ПРЕДСТОЯЩЕГО МАТЧА */
    .upcoming-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 18px 16px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .upcoming-match-body {
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .upcoming-team {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .upcoming-team-icon {
      width: 42px;
      height: 42px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .upcoming-team-name { font-weight: 700; font-size: 14px; }
    .upcoming-center-info { padding: 0 10px; }
    .upcoming-status-title { color: var(--accent); font-weight: 800; font-size: 18px; letter-spacing: 1px; }
    .upcoming-date-time { font-size: 12px; color: var(--hint); margin-top: 4px; font-weight: 600; }

    /* СОСТАВ КОМАНДЫ */
    .squad-group-title { font-size: 14px; font-weight: 800; color: var(--hint); margin: 18px 0 10px 0; text-transform: uppercase; }
    .player-row-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--card-inner);
      border-radius: 10px;
      margin-bottom: 8px;
    }
    .player-left { display: flex; align-items: center; gap: 12px; }
    .player-avatar {
      width: 36px; height: 36px;
      background: #323238;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 13px; color: #fff;
      overflow: hidden;
      background-size: cover;
      background-position: center;
    }
    .player-info-name { font-weight: 700; font-size: 14px; }
    .player-info-meta { font-size: 12px; color: var(--hint); margin-top: 2px; font-weight: 600; }
    
    /* ПОЛЕ 5+1 */
    .pitch-container {
      width: 100%;
      height: 380px;
      background-color: var(--pitch-bg);
      border-radius: 14px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
      margin: 12px 0;
    }
    .pitch-line-center { position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--pitch-line); }
    .pitch-circle-center {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 80px; height: 80px; border: 1px solid var(--pitch-line); border-radius: 50%;
    }
    .pitch-box-top {
      position: absolute; top: 0; left: 25%; right: 25%; height: 60px;
      border: 1px solid var(--pitch-line); border-top: none;
    }
    .pitch-box-bottom {
      position: absolute; bottom: 0; left: 25%; right: 25%; height: 60px;
      border: 1px solid var(--pitch-line); border-bottom: none;
    }

    .pitch-player-abs {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: grab;
      z-index: 10;
      touch-action: none; 
    }
    .player-avatar-circle {
      width: 34px; height: 34px;
      background: var(--accent);
      color: #000;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 13px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      border: 2px solid #ffffff;
      position: relative;
    }
    /* Иконки событий поверх игрока */
    .player-event-badge {
      position: absolute;
      top: -5px; right: -5px;
      background: var(--bg);
      border-radius: 50%;
      font-size: 10px;
      padding: 2px;
    }

    .pitch-tools-btn {
      position: absolute;
      top: 8px; left: 8px;
      background: var(--card-inner);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: white;
      padding: 6px;
      z-index: 100;
      cursor: pointer;
      font-size: 14px;
    }
    /* ФОРМЫ И АДМИНКА ГОЛОВ */
    input, select, textarea, button.form-btn {
      width: 100%; padding: 11px; margin-top: 6px; margin-bottom: 10px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
      background: var(--bg); color: var(--text); box-sizing: border-box; font-family: inherit;
    }
    textarea { resize: vertical; min-height: 50px; }
    button.form-btn { background: var(--accent); color: white; font-weight: bold; border: none; cursor: pointer; }
    button.cancel-btn { background: transparent; color: var(--hint); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 8px; width: 100%; cursor: pointer; font-weight: bold; margin-bottom: 10px; }

    /* МОДАЛЬНЫЕ ОКНА */
    .match-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--bg); z-index: 1000; display: none; overflow-y: auto; padding-bottom: 30px; }
    .match-modal.active { display: block; }
    .modal-top-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background-color: var(--card-bg); border-bottom: 1px solid rgba(255,255,255,0.05); }
    .back-btn { background: none; border: none; color: var(--text); font-size: 22px; cursor: pointer; padding: 0 8px 0 0; }
    
    .team-toggle-group { display: flex; gap: 8px; margin-bottom: 12px; }
    .team-toggle-btn { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: var(--card-inner); color: var(--hint); font-weight: bold; font-size: 13px; cursor: pointer; }
    .team-toggle-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background-color: var(--card-bg); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); z-index: 999; }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--hint); border: none; background: none; cursor: pointer; }
    .nav-item.active { color: var(--accent); }
    .nav-item span { font-size: 20px; }

    /* ПРОФИЛЬ ИГРОКА */
    #player-profile-modal { z-index: 1050; }
    .pp-header { padding: 16px; background: linear-gradient(180deg, #282830 0%, var(--bg) 100%); }
    .pp-top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .pp-top-actions { display: flex; gap: 16px; font-size: 18px; align-items: center; }
    .pp-star { color: #fff; cursor: pointer; font-size: 20px; line-height: 1; text-shadow: 0 0 2px rgba(0,0,0,0.5); }
    .pp-star.active { color: var(--gold); }
    
    .pp-profile-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .pp-profile-left { display: flex; align-items: center; gap: 14px; }
    .pp-avatar-lg { width: 64px; height: 64px; border-radius: 50%; background: var(--card-inner); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; border: 2px solid rgba(255,255,255,0.1); }
    .pp-player-name { font-size: 20px; font-weight: 800; }
    
    .pp-tab-content { display: none; }
    .pp-tab-content.active { display: block; }

    /* ЛУЧШИЕ ИГРОКИ - Вкладка */
    .best-player-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .best-player-val { font-size: 16px; font-weight: bold; color: var(--accent); }
    .expand-btn { background: rgba(255,255,255,0.05); color: var(--text); border: none; border-radius: 8px; padding: 8px; width: 100%; margin-top: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="team-header">
    <div class="team-title-row">
      <div class="team-badge-icon">⚽</div>
      <div><div class="team-name">ФК Яйц</div></div>
    </div>
    <div class="top-nav-tabs">
      <button class="top-tab-btn active" onclick="switchMainTab('details', this)">Детали</button>
      <button class="top-tab-btn" onclick="switchMainTab('matches', this)">Матчи</button>
      <button class="top-tab-btn" onclick="switchMainTab('squad', this)">Состав</button>
      <button class="top-tab-btn" onclick="switchMainTab('best', this)">Лучшие</button>
    </div>
  </div>

  <div id="tab-details" class="tab-content active">
    <div class="section-title">Предстоящие матчи</div>
    <div id="upcoming-match-widget"></div>
  </div>

  <div id="tab-matches" class="tab-content">
    <h3 style="margin-top:0;">История матчей</h3>
    <div id="matches-list">Загрузка...</div>
  </div>

  <div id="tab-squad" class="tab-content">
    <div id="squad-list-container">Загрузка состава...</div>
  </div>

  <!-- ВКЛАДКА ЛУЧШИЕ ИГРОКИ -->
  <div id="tab-best" class="tab-content">
    <div class="card">
      <div class="section-title" style="margin:0 0 10px 0;">⚽ Бомбардиры</div>
      <div id="best-scorers-list"></div>
      <button class="expand-btn" onclick="toggleExpand('best-scorers-list')">Развернуть</button>
    </div>
    <div class="card">
      <div class="section-title" style="margin:0 0 10px 0;">👟 Ассистенты</div>
      <div id="best-assists-list"></div>
      <button class="expand-btn" onclick="toggleExpand('best-assists-list')">Развернуть</button>
    </div>
    <div class="card">
      <div class="section-title" style="margin:0 0 10px 0;">🧤 Вратари (Сейвы)</div>
      <div id="best-gk-list"></div>
      <button class="expand-btn" onclick="toggleExpand('best-gk-list')">Развернуть</button>
    </div>
  </div>

  <div id="tab-admin" class="tab-content">
    <h3>⚙️ Панель администратора</h3>

    <div class="card" id="card-match-form">
      <div class="card-accordion-header" onclick="toggleAccordion('card-match-form')">
        <h4 id="form-title">➕ Добавить / Редактировать матч</h4>
        <div class="accordion-icon">▼</div>
      </div>
      <div class="card-body">
        <label style="font-size:12px; color:var(--hint);">Статус матча</label>
        <select id="match_status" onchange="toggleAdminFields()">
          <option value="finished">Завершенный матч</option>
          <option value="upcoming_roster">Предстоящий матч (Заявка - Список)</option>
          <option value="upcoming_lineup">Предстоящий матч (Расстановка на поле)</option>
        </select>

        <input type="text" id="team1" placeholder="Команда 1 (например, ФК Яйц)">
        <input type="text" id="team2" placeholder="Команда 2 (например, Дворовая Сборная)">
        <input type="text" id="score" placeholder="Счет или время (например, 4 : 1)">
        <input type="text" id="match_date" placeholder="Дата (например, 24.07.26)">

        <!-- Списки игроков для "Заявки" (появляется только для upcoming_roster) -->
        <div id="group-roster" style="display:none;">
          <label style="font-size:12px; color:var(--hint);">Список игроков на матч (Заявка)</label>
          <textarea id="roster-text" placeholder="Введите игроков через запятую или с новой строки"></textarea>
        </div>

        <!-- Поле для "Расстановки" (появляется для finished и upcoming_lineup) -->
        <div id="group-pitch">
          <label style="font-size:13px; font-weight:bold; color:var(--accent);">📐 Расстановка 5+1</label>
          <div class="team-toggle-group">
            <button id="admin-t1-btn" class="team-toggle-btn active" type="button" onclick="selectAdminLineupTeam(1)">Команда 1</button>
            <button id="admin-t2-btn" class="team-toggle-btn" type="button" onclick="selectAdminLineupTeam(2)">Команда 2</button>
          </div>
          <div class="pitch-container" id="admin-pitch">
            <button class="pitch-tools-btn" onclick="toggleEventMode()">⭐ События</button>
            <div class="pitch-line-center"></div>
            <div class="pitch-circle-center"></div>
            <div class="pitch-box-top"></div>
            <div class="pitch-box-bottom"></div>
            <div id="admin-pitch-players"></div>
          </div>
        </div>

        <div id="group-subs">
          <label style="font-size:12px; color:var(--hint); margin-top:12px;">Замены / Скамейка запасных</label>
          <textarea id="subs-text" placeholder="Укажите игроков на замене"></textarea>
        </div>

        <button class="form-btn" id="save-btn" onclick="saveMatch()">Сохранить матч</button>
      </div>
    </div>
  </div>

  <!-- ПРОФИЛЬ ИГРОКА -->
  <div id="player-profile-modal" class="match-modal">
    <div class="pp-header">
      <div class="pp-top-nav">
        <button class="back-btn" onclick="closePlayerProfile()">←</button>
        <div class="pp-top-actions">
          <span class="pp-star" id="pp-star-btn" onclick="toggleStar(this)">☆</span>
        </div>
      </div>
      <div class="pp-profile-row">
        <div class="pp-profile-left">
          <div class="pp-avatar-lg" id="pp-avatar">⚽</div>
          <div>
            <div class="pp-player-name" id="pp-name">Имя Игрока</div>
            <div class="pp-team-sub"><span>⚽</span> <span id="pp-team-name">ФК Яйц</span></div>
          </div>
        </div>
        <!-- ПЛАШКА С ПОДПИСЧИКАМИ УДАЛЕНА -->
      </div>
    </div>
  </div>

  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-item active" onclick="switchMainTab('details', this)"><span>⚽️</span>Команда</button>
    <button id="admin-nav-btn" class="nav-item" onclick="switchMainTab('admin', this)" style="display:none;"><span>⚙️</span>Админка</button>
  </nav>

  <script>
    const ADMIN_TELEGRAM_ID = 1435007314; 
    // Замените ключи на свои
    const SUPABASE_URL = 'https://ssriiiiuljdeftigdiyl.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_jWUTsulzCMEQV6O26zac-g_04tBxiy4';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();

    const userId = tg.initDataUnsafe?.user?.id;
    if (userId === ADMIN_TELEGRAM_ID) {
      document.getElementById('admin-nav-btn').style.display = 'flex';
    } else {
      document.getElementById('bottom-nav').style.display = 'none';
      document.body.style.paddingBottom = '0';
    }

    let allSquad = [];
    let eventModeActive = false;

    // Вкладки
    function switchMainTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.team-header .top-tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      if (btn) btn.classList.add('active');
    }

    function toggleAccordion(cardId) {
      document.getElementById(cardId).classList.toggle('open');
    }

    // Подписка на игрока (Звездочка)
    async function toggleStar(element) {
      const isSubscribed = element.classList.contains('active');
      const playerName = document.getElementById('pp-name').innerText;
      
      if (!isSubscribed) {
        element.innerText = '⭐';
        element.classList.add('active');
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        
        // Пример сохранения подписки в Supabase (потребуется таблица user_subscriptions)
        // await _supabase.from('subscriptions').insert([{ user_id: userId, player_name: playerName }]);
        tg.showAlert(`Вы подписались на уведомления об игроке: ${playerName}`);
      } else {
        element.innerText = '☆';
        element.classList.remove('active');
      }
    }

    // Управление полями в админке в зависимости от типа матча
    function toggleAdminFields() {
      const status = document.getElementById('match_status').value;
      const isRoster = (status === 'upcoming_roster');
      const isLineup = (status === 'upcoming_lineup');
      const isFinished = (status === 'finished');

      document.getElementById('group-roster').style.display = isRoster ? 'block' : 'none';
      document.getElementById('group-pitch').style.display = isRoster ? 'none' : 'block';
      document.getElementById('group-subs').style.display = 'block'; // Скамейка теперь везде нужна
    }

    // Отрисовка лучших игроков
    function renderBestPlayers() {
      // Здесь предполагается, что в allSquad есть поля goals, assists, saves (или подтягиваются из career)
      // Для примера создадим моковые данные на основе allSquad
      const mockStats = allSquad.map(p => ({
        name: p.name,
        goals: Math.floor(Math.random() * 10),
        assists: Math.floor(Math.random() * 10),
        saves: p.position === 'GK' ? Math.floor(Math.random() * 20) : 0
      }));

      const renderList = (data, field, containerId) => {
        const sorted = data.sort((a,b) => b[field] - a[field]);
        let html = sorted.map((p, i) => `
          <div class="best-player-row" style="${i > 2 ? 'display:none;' : ''}">
            <div>${i+1}. ${p.name}</div>
            <div class="best-player-val">${p[field]}</div>
          </div>
        `).join('');
        document.getElementById(containerId).innerHTML = html;
      };

      renderList(mockStats, 'goals', 'best-scorers-list');
      renderList(mockStats, 'assists', 'best-assists-list');
      renderList(mockStats.filter(p=>p.saves>0), 'saves', 'best-gk-list');
    }

    function toggleExpand(containerId) {
      const container = document.getElementById(containerId);
      const rows = container.querySelectorAll('.best-player-row');
      rows.forEach(r => r.style.display = 'flex');
      event.target.style.display = 'none'; // скрыть кнопку
    }

    // Режим "Событий" на поле (Иконки голов, ассистов)
    function toggleEventMode() {
      eventModeActive = !eventModeActive;
      const btn = document.querySelector('.pitch-tools-btn');
      btn.style.background = eventModeActive ? 'var(--accent)' : 'var(--card-inner)';
      if(eventModeActive) tg.showAlert("Выберите игрока на поле, чтобы добавить ему событие (Гол, Ассист и т.д.)");
    }

    // Эта функция должна вызываться при клике на кружок игрока на поле в админке
    function onPlayerPitchClick(playerId) {
      if (!eventModeActive) return;
      // В Telegram WebApp нет встроенных сложных модалок-селектов, можно использовать confirm/prompt 
      // или кастомный HTML-попап. Здесь упрощенный вариант:
      const action = prompt("Введите событие (1: Гол, 2: Автогол, 3: Ассист, 4: Травма, 5: Сейв пенальти):");
      
      let icon = "";
      if (action === '1') icon = "⚽";
      else if (action === '2') icon = "❌";
      else if (action === '3') icon = "👟";
      else if (action === '4') icon = "🩹";
      else if (action === '5') icon = "🧤";

      if (icon) {
        // Логика добавления бейджа на HTML-элемент игрока:
        // playerElement.innerHTML += <div class="player-event-badge">${icon}</div>;
        tg.showAlert(`Событие ${icon} добавлено!`);
      }
    }

    // Сохранение матча и триггер уведомлений
    async function saveMatch() {
      const status = document.getElementById('match_status').value;
      // ... (код сохранения матча в Supabase)

      if (status === 'finished') {
        notifyBotAboutMatch("Матч завершен!");
      }
      tg.showAlert("Матч успешно сохранен.");
    }

    // Отправка сигнала боту для рассылки
    function notifyBotAboutMatch(message) {
      // Пример вызова Edge Function, которая уже обратится к Telegram Bot API
      /*
      _supabase.functions.invoke('notify-bot', {
        body: { message: message, matchId: currentMatchId }
      });
      */
      console.log("Уведомление боту отправлено: ", message);
    }

    // Инициализация
    setTimeout(() => { toggleAdminFields(); renderBestPlayers(); }, 1000);

  </script>
</body>
