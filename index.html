<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Дворовый Flashscore</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Подключаем клиент Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #121212);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e1e1e);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #a1a1aa);
      --accent: #22c55e;
      --danger: #ef4444;
      --gold: #f59e0b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0 0 70px 0;
    }

    header {
      background-color: var(--card-bg);
      padding: 16px;
      text-align: center;
      font-weight: bold;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .tab-content { display: none; padding: 16px; }
    .tab-content.active { display: block; }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    input, select, button.form-btn {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: var(--bg);
      color: var(--text);
      box-sizing: border-box;
    }

    button.form-btn {
      background: var(--accent);
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .delete-btn {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid var(--danger);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .match-header {
      font-size: 12px;
      color: var(--hint);
      margin-bottom: 8px;
      text-align: center;
    }

    .match-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 15px;
    }

    /* Стили для авторов голов */
    .goals-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--hint);
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(255,255,255,0.1);
    }

    .goals-col {
      width: 48%;
      word-wrap: break-word;
    }

    .goals-col.right {
      text-align: right;
    }

    /* Стили для лучшего игрока */
    .mvp-row {
      margin-top: 10px;
      padding-top: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--gold);
      text-align: center;
      background: rgba(245, 158, 11, 0.1);
      border-radius: 6px;
      padding: 6px;
    }

    .admin-match-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      color: var(--hint);
      border: none;
      background: none;
    }

    .nav-item.active { color: var(--accent); }
    .nav-item span { font-size: 20px; }
    
    #admin-nav-btn { display: none; }
  </style>
</head>
<body>

  <header>⚽️ ФК «Наш Двор»</header>

  <!-- ВКЛАДКА: МАТЧИ -->
  <div id="matches" class="tab-content active">
    <h3>Список матчей</h3>
    <div id="matches-list">Загрузка матчей...</div>
  </div>

  <!-- ВКЛАДКА: СЕКРЕТНАЯ АДМИНКА -->
  <div id="admin" class="tab-content">
    <h3>⚙️ Панель администратора</h3>
    
    <!-- Форма создания -->
    <div class="card">
      <h4>➕ Добавить новый матч</h4>
      <input type="text" id="team1" placeholder="Команда 1 (например, Наш Двор)">
      <input type="text" id="team2" placeholder="Команда 2 (например, Соседи)">
      <input type="text" id="score" placeholder="Счет (например, 3 : 1)">
      <input type="text" id="match_date" placeholder="Дата/время (например, Сегодня в 18:00)">
      <input type="text" id="goals1" placeholder="Голы Команды 1 (например, Иванов, Петров-2)">
      <input type="text" id="goals2" placeholder="Голы Команды 2 (например, Сидоров)">
      <input type="text" id="best_player" placeholder="⭐ Лучший игрок (например, Алексей Иванов)">
      <button class="form-btn" onclick="addMatch()">Сохранить матч</button>
    </div>

    <!-- Управление созданными матчами -->
    <div class="card">
      <h4>🗑️ Управление матчами</h4>
      <div id="admin-matches-list">Загрузка...</div>
    </div>
  </div>

  <!-- НИЖНЯЯ НАВИГАЦИЯ -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('matches', this)">
      <span>⚽️</span>Матчи
    </button>
    <button id="admin-nav-btn" class="nav-item" onclick="switchTab('admin', this)">
      <span>⚙️</span>Админка
    </button>
  </nav>

  <script>
    // ТВОЙ TELEGRAM ID
    const ADMIN_TELEGRAM_ID = 1435007314; 

    // ТВОИ ДАННЫЕ SUPABASE
    const SUPABASE_URL = 'https://ssriiiiuljdeftigdiyl.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_jWUTsulzCMEQV6O26zac-g_04tBxiy4';
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Проверяем, админ ли открыл приложение
    const userId = tg.initDataUnsafe?.user?.id;
    if (userId === ADMIN_TELEGRAM_ID) {
      document.getElementById('admin-nav-btn').style.display = 'flex';
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    // Добавление матча
    async function addMatch() {
      const team1 = document.getElementById('team1').value;
      const team2 = document.getElementById('team2').value;
      const score = document.getElementById('score').value;
      const match_date = document.getElementById('match_date').value;
      const goals1 = document.getElementById('goals1').value;
      const goals2 = document.getElementById('goals2').value;
      const best_player = document.getElementById('best_player').value;

      if (!team1 || !team2) return alert('Заполните названия команд');

      const { data, error } = await _supabase
        .from('matches')
        .insert([{ team1, team2, score, match_date, goals1, goals2, best_player }]);

      if (error) {
        alert('Ошибка при сохранении: ' + error.message);
      } else {
        alert('Матч успешно добавлен!');
        document.getElementById('team1').value = '';
        document.getElementById('team2').value = '';
        document.getElementById('score').value = '';
        document.getElementById('match_date').value = '';
        document.getElementById('goals1').value = '';
        document.getElementById('goals2').value = '';
        document.getElementById('best_player').value = '';
        loadMatches();
      }
    }

    // Удаление матча из базы
    async function deleteMatch(id) {
      if (!confirm('Вы уверены, что хотите удалить этот матч?')) return;

      const { error } = await _supabase
        .from('matches')
        .delete()
        .eq('id', id);

      if (error) {
        alert('Ошибка при удалении: ' + error.message);
      } else {
        alert('Матч удален!');
        loadMatches();
      }
    }

    // Загрузка матчей
    async function loadMatches() {
      const { data: matches, error } = await _supabase
        .from('matches')
        .select('*')
        .order('created_at', { ascending: false });

      const container = document.getElementById('matches-list');
      const adminContainer = document.getElementById('admin-matches-list');

      if (error || !matches || matches.length === 0) {
        container.innerHTML = '<p style="color:var(--hint);">Матчей пока нет.</p>';
        adminContainer.innerHTML = '<p style="color:var(--hint);">Нет сохраненных матчей.</p>';
        return;
      }

      // Список для пользователей
      container.innerHTML = matches.map(m => {
        const hasGoals = m.goals1 || m.goals2;
        return `
          <div class="card">
            ${m.match_date ? `<div class="match-header">📅 ${m.match_date}</div>` : ''}
            <div class="match-row">
              <span style="width:38%; text-align:left;">${m.team1}</span>
              <span style="color:var(--accent); text-align:center; min-width:40px;">${m.score || 'vs'}</span>
              <span style="width:38%; text-align:right;">${m.team2}</span>
            </div>
            ${hasGoals ? `
              <div class="goals-row">
                <div class="goals-col">⚽ ${m.goals1 || '—'}</div>
                <div class="goals-col right">⚽ ${m.goals2 || '—'}</div>
              </div>
            ` : ''}
            ${m.best_player ? `<div class="mvp-row">🏅 Лучший игрок: ${m.best_player}</div>` : ''}
          </div>
        `;
      }).join('');

      // Список для админа
      adminContainer.innerHTML = matches.map(m => `
        <div class="admin-match-item">
          <div>
            <strong>${m.team1} — ${m.team2}</strong> <br>
            <small style="color:var(--hint);">
              ${m.match_date ? '📅 ' + m.match_date + ' | ' : ''}Счет: ${m.score || 'не указан'}
            </small>
          </div>
          <button class="delete-btn" onclick="deleteMatch('${m.id}')">🗑️ Удалить</button>
        </div>
      `).join('');
    }

    loadMatches();
  </script>
</body>
</html>
